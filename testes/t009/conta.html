<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon-real.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Conta</title>
</head>
<body class="fundo">
    <header>
        <img src="imagens/logo-real.png" alt="Logo da Alpha Tec Ventures">
        <p>Tem coisas que só a Alpha Tec faz para você no mundo Tec!</p>
        <nav>
            <a href="home.html">Home</a>
            <a href="conta.html">Conta</a>
            <a href="contato.html">Contato</a>
            <a href="entrar.html">Entrar</a>
        </nav>
    </header>
    <main class="conta">
        <form action="../../exercicios/ex025/cadastro.php" method="post" autocomplete="on">
            <p>
                Criar uma Conta
            </p>
            <p>
                <label for="inome">Nome: </label> <br>
                <input type="text" name="nome" id="inome" autocomplete="name" required>
            </p>
            <p>
                <label for="iemail">E-mail: </label> <br>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="isenha">Senha: </label> <br>
                <input type="password" name="senha" id="isenha" autocomplete="new-password" required>
            </p>
            <p>
                <label for="Gênero">Gênero: </label> <br>
                <input type="radio" name="Gênero" id="M" required> Masculino
                <input type="radio" name="Gênero" id="F" required> Feminino
             </p>
            <p>
                <label for="inas">Nascimento: </label> <br>
                <input type="date" name="nas" id="inas" required>
            </p>
            <p>
                <input type="submit" value="Confirmar">
            </p>
        </form>
    </main>
</body>
</html>
