<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste 014</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: absolute;
            height: 100vh;
            width: 100vw;
        }

        form {
            position: relative;
            height: 310px;
            width: 202px;
            padding: 10px;
            text-align: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #confirmar {
            background-color: rgba(128, 128, 128, 0.06);
            border: 0px;
            height: 40px;
            width: 200px;
            font-weight: bold;
            font-size: 15px;
        }

        input {
            margin: 4px;
        }
    </style>
</head>
<body>
    <form action="../../exercicios/ex025/cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="inome">Nome Completo: </label> <br>
            <input type="text" name="nome" id="inome" autocomplete="name" required>
        </p>
        <p>
            <label for="iemail">E-mail: </label> <br>
            <input type="email" name="email" id="iemail" autocomplete="email" required>
        </p>
        <p>
            <label for="">Gênero: </label> <br>
            <input type="radio" name="genero" id="M" required> Masculino
            <input type="radio" name="genero" id="F" required> Feminino
        </p>
        <p>
            <label for="isenha">Senha: </label> <br>
            <input type="password" name="senha" id="isenha" autocomplete="current-password" required>
        </p>
        <p>
            <input type="submit" value="Confirmar" id="confirmar">
        </p>
    </form>
</body>
</html>
