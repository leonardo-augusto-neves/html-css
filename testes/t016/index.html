<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: monospace;
            font-size: 22px;
        }

        body {
            background-color: rgb(198, 216, 255);
        }

        #calculadora {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgb(41, 41, 41);
            border: 1px solid rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 20px;
            margin: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.8);
        }

        div {
            background-color: rgba(0, 0, 0, 0.7);
            width: 100%;
            height: 70px;
            margin-bottom: 10px;
        }

        button {
            background-color: white;
            border: 0px;
            border-radius: 10px;
            padding: 15px 21px;
            margin: 5px 1.5px;
            cursor: pointer;
        }

        #maior {
            padding: 14px 10px; 
        }

        #zero {
            width: 123px ;
        }

        .cor {
            background-color: rgb(175, 198, 248);
        }
    </style>
</head>
<body>
    <main id="calculadora">
        <div></div>
        <button class="cor">C</button>
        <button id="maior" class="cor">+/-</button>
        <button class="cor">%</button>
        <button class="cor">÷</button> <br>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="cor">X</button> <br>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="cor">-</button> <br>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="cor">+</button> <br>
        <button id="zero">0</button>
        <button>.</button>
        <button class="cor">=</button>
    </main>
</body>
</html>
