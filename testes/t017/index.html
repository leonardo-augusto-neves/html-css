<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
            background-color: black;
            height: 100vh;
        }

        button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: black;
            color: rgb(0, 170, 170);
            border: 1px solid aqua;
            border-radius: 10px;
            padding: 10px 20px;
            margin: 10px;
            box-shadow: 0px 0px 12px rgba(0, 170, 170, 0.1);
        }

        button:hover {
            transition: 0.4s;
            background-color: aqua;
            box-shadow: 0px 0px 20px rgba(0, 170, 170, 0.7);
        }
    </style>
</head>
<body>
    <button>CLIQUE</button>
</body>
</html>
