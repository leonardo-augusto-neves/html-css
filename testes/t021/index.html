<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <img src="imagens/roxo.jpg" alt="">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <p class="input">
                        <label for="iemail"><i class="material-icons">person</i></label>
                        <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="seu e-mail" class="box">
                    </p>
                    <p class="input">
                        <label for="isenha"><i class="material-icons">vpn_key</i></label>
                        <input type="password" name="senha" id="isenha" required autocomplete="current-password" placeholder="sua senha"  class="box"> 
                    </p>
                    <p id="confirmar">
                        <input type="submit" value="Entrar" id="button">
                    </p>
                    <p id="senha">
                        <a href="#" target="_blank" id="esqueci">Esqueci a senha <i class="material-icons" id="icon-especial">mail</i></a>
                    </p>
                </form>
            </div>
        </section>
    </main>
</body>
</html
