<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugares  para visitar</title>

        :root {
            --cor1: #F03600;

            --fonte-padrao: "DM Mono", sans-serif;
            --fonte-especial: "Great Vibes", serif;
        }

        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: var(--cor4);
        }

        header {
            background-color: var(--cor3);
            text-align: center;
            width: 100vw;
            padding: 20px;
        }

        header > h1 {
            font-family: var(--fonte-especial);
            font-weight: bolder;
            font-size: 4em;
            padding: 10px;
        }

        header > p {
            font-family: var(--fonte-padrao);
            font-weight: normal;
            font-size: 1.3em;
            padding: 10px;
        }
    </style>
</head>
