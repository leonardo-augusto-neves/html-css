<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap');

        * {
            margin: 0px;
            padding: 0px;
            font-family: 'Instrument Sans', Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
            height: 100vh;
        }

        form {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin: 10px 0px 10px 0px;
        }

        h1 > span {
            background-color: rgb(150, 10, 210);
            color: white;
            border-radius: 5px;
            padding: 5px;
        }

        form > p {
            text-align: center;
            margin: 25px;
        }

        #margin {
            margin-bottom: 55px;
        }

        strong {
            color: red;
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            margin: 10px 10px 0px 10px;
        }

        a {
            color: rgb(150, 10, 210);
            text-decoration: none;
        }

        #right {
            display: block;
            color: rgb(150, 10, 210);
            text-decoration: none;
            text-align: right;
        }

        #confirmar {
            background-image: linear-gradient(to left, rgb(150, 10, 210), rgb(180, 110, 210));
            color: white;
            width: 100%;
            font-size: 15px;
            border-radius: 5px;
            border: 0px;
            padding: 10px;
        }

        #confirmar:hover {
            background-image: linear-gradient(to right, rgb(150, 10, 210), rgb(180, 110, 210));
        }

        .box {
            width: 100%;
            height: 16px;
            border-radius: 3px;
            border: 1px solid rgba(0, 0, 0, 0.3);
            padding: 5px;
            margin: 3px 0px;
        }

        .box:focus {
            outline: none;
            border: 1px solid rgba(180, 110, 210, 0.6);
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <form action="../../exercicios/ex025/cadastro.php" method="post" autocomplete="off">
        <h1>
            <span>Welcome</span> Back
        </h1>
        <p id="margin">
            sign in to continue
        </p>
        <div>
            <label for="iemail">Email: <strong>*</strong></label> <br>
            <input type="email" name="email" id="iemail" required class="box">
        </div>
        <div>
            <label for="isenha">Password: <strong>*</strong></label> <br>
            <input type="password" name="senha" id="isenha" required class="box">
        </div>
        <p>
            <a href="#" id="right">Forget password?</a>
        </p>
        <p>
            <input type="submit" value="Sign In" id="confirmar">
        </p>
        <p>
            Dont have an account ? <a href="">Sign Up</a>
        </p>
        <hr>
        <p>
            Or continue with
        </p>
    </form>
</body>
</html>
