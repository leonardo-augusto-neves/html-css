<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        * {
            margin: 0px;
            padding: 0px;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            position: relative;
            height: 100vh;
        }

        form {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 500px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            padding: 10px;
            margin: 10px 10px 0px 10px;
            text-align: center;
            font-size: 1.8em;
            font-weight: bolder;
        }

        span {
            background-color: rgb(120, 45, 200);
            color: white;
            padding: 5px;
            border-radius: 5px;
        }

        .center {
            text-align: center;
            padding: 5px;
            font-size: 15px;
        }

        #confirmar {
            background-image: linear-gradient(to left, rgb(120, 45, 200), rgb(150, 120, 200) );
            color: white;
            display: block;
            width: 392px;
            border: 0px;
            padding: 7px;
            margin: auto;
            border-radius: 5px;
        }

        #confirmar:hover {
            background-image: linear-gradient(to right, rgb(120, 45, 200), rgb(150, 120, 200));
        }


        #right {
            color: rgb(120, 45, 200);
            text-align: right;
            margin: 10px 10px 30px 10px;
        }

        strong {
            color: red;
        }

        .input {
            width: 392px;
            border: 1px solid gray;
            border-radius: 3px;
            padding: 4.5px;
        }

        .input:active:hover {
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }

        label {
            font-size: 15px;
            font-weight: 500;
        }

        #margin {
            margin-bottom: 40px;
        }

        .margin {
            margin-top: 10px;
        }

        #padding {
            padding: 20px;
        }

        a {
            color: rgb(120, 45, 200);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <form action="../../exercicios/ex025/cadastro.php" method="post" autocomplete="off">
        <h1><span>Welcome</span> Back</h1>
        <p class="center" id="margin">sign in to continue</p>
        <p class="margin">
            <label for="iemail">Email: <strong>*</strong></label> <br>
            <input type="email" name="email" id="iemail" required placeholder="your@gmail.com" class="input" >
        </p>
        <p class="margin">
            <label for="isenha">Password: <strong>*</strong></label> <br>
            <input type="password" name="senha" id="isenha" required class="input">
        </p>
        <p id="right" ><a href="">Forget password?</a></p>
        <p>
            <input type="submit" value="Sign In" id="confirmar">
        </p>
        <p class="center" id="padding">Dont have an account ? <a href="sing-up.html">Sing Up</a></p>
        <hr> <p class="center">Or continue with</p>
    </form>
</body>
</html>
