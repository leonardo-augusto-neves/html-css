<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <!-- 
        ANATOMIA DOS FORMULÁRIOS
        FORM
            P
             INPUT

        TIPOS DE INPUT:

        input:text : Cria uma caixa para colocar texto
        input:password : Cria uma caixa para colocar senha
        input:number : Cria uma caixa para colocar numeros
        input:month : Cria uma caixa para colocar mês e ano
        input:date : Cria uma caixa para colocar dia, mês e ano
        input:time : Cria uma caixa para colocar horas e minutos
        input:email : Cria uma caixa para colocar e-mail
        input:tel : Cria uma caixa para colocar telefone
        input:chekbox : Cria uma caixa para marcar ou desmarcar
        input:radio : Cria uma caixa para marcar tendo que marcar só uma vez (REGRA: Para funcionar, as opções tem que ter o mesmo nome)
        input:submit : Cria uma caixa para enviar os dados dentro do input:text
        input:reset : Deleta os dados

        TAGS:

        label : Faz ligação do parágrafo com o input

        name : Mais util para HTML e PHP
        id : Mais util para JavaScript e a tag label

        autocomplete="on" : Liga o preenchimento automático dos formulários
                     "off" : Desliga o preenchimento automático dos formulários
                     "name" : Indica que o autocomplete vai funcionar só para nomes
                     "username" : Indica que o autocomplete vai funcionar só para nomes de usuários
                     "current-password" : Indica que o autocomplete vai funcionar só para senhas que existam do usuário
                     "new-password" : Indica que o autocomplete vai funcionar só para senhas novas
                     "email": Indica que o autocomplete vai funcionar só para email
                     "tel" : Indica que o autocomplete vai funcionar só para telefone

        required : Dados obrigatórios para colocar

        placeholder : Texto dentro do formulário

        step : Passo dos números dentro do formulário input:number

        size : quantos bytes é o tamanho do formulário

        value : O valor inicial do formulário

        fieldset : Serve para separar em grupos os conteúdos dos input

        legend : Legenda do fieldset

        checked : Valor de formulários input:chekbox e input:radio já marcados como valor inicial

        minlength : Indica quantas letras podem ter no minímo no formulário input:text
        maxlength : Indica quantas letras podem ter no maxímo no formulário input:text

        min : Indica quanto o valor do número pode ter no minímo no formulário input:number
        max : Indica quanto o valor do número pode ter no maxímo no formulário input:number


        PARA HTML EXISTE DOIS TIPOS DE METODOS DE ENVIO DE DADOS
        são eles:
        METODO GET(padrão) : Usar quando os dados não forem sensíveis e quando quiser compartilhar URLs, mas só pode enviar dados até 3000 byts
        METODO POST : Usar quando os dados forem sensíveis e pode enviar mais de 3000 byts
    -->
    <h1>Meu primeiro formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p><label for="inome">Nome:</label> 
            <input type="text" name="nome" id="inome"></p>
        <p><label for="isobrenome">Sobrenome:</label> 
            <input type="text" name="sobrenome" id="isobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
