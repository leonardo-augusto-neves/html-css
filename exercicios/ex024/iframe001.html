<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe { /* Parâmetro de iframe prevaleçe mais do que estilo inline */
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>

    <!-- Tamanho padrão dos iframes é 300x150 

         frameborder : 0 : iframe sem borda
                      1 : iframe com borda

         scolling : auto(padrão) : Barra de rolagem dependendo do tamanho do iframe
                    yes : Barra de rolagem prevaleçe
                    no : Barra de rolagem não prevaleçe
    -->

    <p>
        Acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500" width="500">
            <a href="https://www.cursoemvideo.com/" target="_blank" rel="external">Curso em Vídeo</a>
        </iframe>

        para aprender a programar.
    </p>
    <p>
        O repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io/" frameborder="0" height="500" width="500">
            <a href="https://gustavoguanabara.github.io/" target="_blank" rel="external"> no GitHub</a>
        </iframe>

        também é bem legal!
    </p>
</body>
</html>
